name: Deploy JupyterLite site to GitHub Pages

# Runs automatically whenever you push to main.
# You can also trigger it manually from the Actions tab (workflow_dispatch).
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel one that's already deploying.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install JupyterLite build dependencies
        run: pip install -r requirements.txt

      - name: Strip cell outputs before building
        run: jupyter nbconvert --clear-output --inplace content/*.ipynb

      - name: Build the JupyterLite site
        # --contents content bundles everything in content/ (notebooks, CSVs, etc.)
        # so it's already there for every visitor, with no upload step required.
        run: jupyter lite build --contents content --output-dir dist

      - name: Upload build as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
